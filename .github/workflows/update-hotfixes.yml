name: Update NVIDIA Hotfixes Feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: update-nvidia-hotfixes
  cancel-in-progress: false

jobs:
  update-hotfixes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hotfixes ermitteln und hotfixes.json aktualisieren
        run: python3 .github/scripts/update_hotfixes.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotfixes.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen an hotfixes.json vorhanden."
          else
            git commit -m "chore(drivers): update hotfixes.json feed"
            git pull --rebase origin main
            git push origin HEAD:refs/heads/main
          fi
